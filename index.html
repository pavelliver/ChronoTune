<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChronoTune</title>
<meta name="description" content="Hear a song, place it in time. A pass-the-phone music timeline game.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131215" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChronoTune">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred column (max 34rem). Quiet light surfaces, the dark "now playing" record card is the one bold moment, timelines read as catalogue rows. */
:root{
  --bg:#f5f3ef; --surface:#ffffff; --sunk:#ece8e2; --line:#e2dcd4; --ink:#1d1b18; --muted:#716a63; --faint:#a39b93;
  --stage:#1c191e; --stage-2:#2d2830; --stage-ink:#f6f2eb; --stage-muted:#978e98; --gold:#f3c34f;
  --p1:#0e8b7f; --p1-soft:#e2f2ef; --p2:#df5f27; --p2-soft:#fbeae1; --p3:#6a58d4; --p3-soft:#ece9fb; --p4:#2b7bc9; --p4-soft:#e2edf9;
  --on-acc:#ffffff;
  --ok:#1d8a52; --ok-soft:#e3f4ea; --bad:#c43a4b; --bad-soft:#fbe6e9; --warn:#9a6200; --warn-soft:#fbf0d9;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131215; --surface:#1c1b1f; --sunk:#262429; --line:#322f36; --ink:#efebe5; --muted:#a59e98; --faint:#6f6963;
    --stage:#29242e; --stage-2:#3a3341; --stage-ink:#f6f2eb; --stage-muted:#aaa0ad; --gold:#f3c34f;
    --p1:#33bcad; --p1-soft:#14312e; --p2:#f08853; --p2-soft:#3a2319; --p3:#9d90f2; --p3-soft:#27233f; --p4:#62a8ec; --p4-soft:#172a3e;
    --on-acc:#111013;
    --ok:#4cc386; --ok-soft:#14301f; --bad:#ef6d7d; --bad-soft:#3b1a20; --warn:#e5a845; --warn-soft:#352812;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131215; --surface:#1c1b1f; --sunk:#262429; --line:#322f36; --ink:#efebe5; --muted:#a59e98; --faint:#6f6963;
  --stage:#29242e; --stage-2:#3a3341; --stage-ink:#f6f2eb; --stage-muted:#aaa0ad; --gold:#f3c34f;
  --p1:#33bcad; --p1-soft:#14312e; --p2:#f08853; --p2-soft:#3a2319; --p3:#9d90f2; --p3-soft:#27233f; --p4:#62a8ec; --p4-soft:#172a3e;
  --on-acc:#111013;
  --ok:#4cc386; --ok-soft:#14301f; --bad:#ef6d7d; --bad-soft:#3b1a20; --warn:#e5a845; --warn-soft:#352812;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit}

.shell{max-width:34rem;margin:0 auto;padding-inline:16px;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
#top,#bottom{display:flex;flex-direction:column;gap:14px}
#bottom:empty{display:none}

/* Header */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--stage);display:grid;place-items:center}
.mark i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,var(--gold) 0 3px,var(--stage) 3px 4px,transparent 4.5px),repeating-radial-gradient(circle,var(--stage-muted) 0 .8px,var(--stage) .8px 2.4px)}
.wordmark{font:800 22px/1 var(--f-display);letter-spacing:-.02em}
.linkbtn{border:0;background:none;padding:6px 8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.linkbtn:hover{color:var(--ink);background:var(--sunk)}
.linkbtn.armed{color:var(--bad)}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.lede{margin:0;color:var(--muted);text-align:center;text-wrap:balance}
.note{background:var(--sunk);border-radius:var(--r-md);padding:12px 14px;font-size:13px;line-height:1.55;color:var(--muted)}
.note b{color:var(--ink);font-weight:600}
.note p{margin:0}
.note p+p{margin-top:6px}
.foot{font-size:12px;color:var(--faint);text-align:center;text-wrap:balance}
.foot a{color:var(--muted)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.msg{margin:0;font-size:13px;font-weight:600}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.acc-text{color:var(--acc)}
.num{font-variant-numeric:tabular-nums}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:var(--r-md);padding:13px 16px;font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.985)}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:var(--r-sm);width:auto}
.btn:disabled{background:var(--sunk);color:var(--faint);border-color:transparent;cursor:not-allowed;transform:none}
.btn svg{width:17px;height:17px;flex:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Setup controls */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;font-size:15px}
.field input:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setrow > span{font-weight:600;font-size:14px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--sunk)}
.poolline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.poolline b{font:500 15px var(--f-mono);color:var(--ink)}
details.card{gap:0}
details.card[open]{gap:12px}
details summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.badge{margin-left:auto;font:500 12px var(--f-mono);background:var(--sunk);color:var(--muted);border-radius:999px;padding:2px 8px}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;font:400 13px/1.5 var(--f-mono)}
textarea:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.mylist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.mylist li{display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.mylist .yr{font:500 13px var(--f-mono);color:var(--muted)}
.mylist .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;color:var(--faint);padding:2px 6px;border-radius:6px;font-size:16px;line-height:1}
.x:hover{color:var(--bad);background:var(--sunk)}

/* Status bar */
.status{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 11px;min-width:0}
.tile.active{border-color:var(--acc);background:var(--acc-soft)}
.tile-name{font-size:13px;font-weight:700;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-score{display:flex;align-items:baseline;gap:4px;margin-top:2px;font-variant-numeric:tabular-nums}
.tile-score b{font:800 24px/1.1 var(--f-display)}
.tile-score span{font-size:13px;color:var(--faint)}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}

/* Turn intro */
.handoff{text-align:center;padding:30px 16px}
.handoff .who{font:800 34px/1.1 var(--f-display);letter-spacing:-.02em;color:var(--acc);text-wrap:balance;overflow-wrap:anywhere}

/* Stage: the now-playing record card */
.stage{background:var(--stage);color:var(--stage-ink);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:16px}
.stage-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.disc{position:relative;width:104px;height:104px;border-radius:50%;
  background:conic-gradient(from 20deg,transparent 0 18%,rgba(255,255,255,.07) 23%,transparent 29% 68%,rgba(255,255,255,.05) 73%,transparent 79%),repeating-radial-gradient(circle,#0c0b0d 0 1.4px,#1b191d 1.4px 2.9px);
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 10px 24px rgba(0,0,0,.35)}
.disc::after{content:"";position:absolute;inset:33px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#0c0b0d 0 3px,transparent 3.5px),radial-gradient(circle at 50% 22%,rgba(255,255,255,.6) 0 2px,transparent 2.6px),var(--acc)}
.disc.spin{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--stage-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-title{font:700 21px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.s-artist{font-size:14px;color:var(--stage-muted);overflow-wrap:anywhere}
.s-year{font:500 46px/1 var(--f-mono);letter-spacing:-.03em;color:var(--stage-muted);margin-top:8px;font-variant-numeric:tabular-nums}
.s-year.on{color:var(--gold)}
.s-year.anim{animation:flip .5s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.transport{display:flex;align-items:center;gap:12px}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--stage-ink);color:var(--stage);display:grid;place-items:center}
.play svg{width:20px;height:20px}
.play:focus-visible{outline-color:var(--gold)}
.bar{flex:1;height:5px;border-radius:99px;background:var(--stage-2);overflow:hidden}
.fill{height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .4s linear}
.time{font:500 12px var(--f-mono);color:var(--stage-muted);min-width:5.6em;text-align:right;font-variant-numeric:tabular-nums}
.stage-links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.stage-links a{color:var(--stage-muted);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.stage-links a:hover{color:var(--stage-ink)}
.stage-links svg{width:14px;height:14px}

/* Spotify strip */
.player{display:flex;flex-direction:column;gap:6px}
.embed-box{position:relative;min-height:80px;border-radius:12px;overflow:hidden;background:var(--sunk)}
#embedHost iframe{display:block;width:100%;height:80px;border:0}
.connecting{height:80px;display:flex;align-items:center;padding:0 14px;font-size:13px;color:var(--muted)}
.mask{position:absolute;top:0;left:0;bottom:0;right:78px;background:var(--surface);border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;display:flex;align-items:center;gap:12px;padding:0 14px;min-width:0}
.mask .sp{flex:none;width:30px;height:30px;border-radius:50%;background:#1ed760;display:grid;place-items:center}
.mask .sp svg{width:18px;height:18px;color:#0b0b0b}
.mask div{min-width:0;font-size:12.5px;line-height:1.35;color:var(--muted)}
.mask b{display:block;color:var(--ink);font-size:13px}
.blocked{display:block;padding:12px 14px;font-size:13px;line-height:1.45;color:var(--muted);border:1px solid var(--line);border-radius:12px}
.blocked b{color:var(--bad)}
.blocked a{color:var(--ink);font-weight:600}
.alert{background:var(--warn-soft);border-radius:var(--r-md);padding:12px 14px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.alert b{color:var(--warn)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* Timeline */
.tl{gap:8px}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tl-body{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:3.3rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.row .yr{font:500 15px var(--f-mono);color:var(--acc);font-variant-numeric:tabular-nums}
.row .meta{display:flex;flex-direction:column;min-width:0}
.row .t{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.row .a{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row svg{width:18px;height:18px}
.row.new{border-color:var(--ok);background:var(--ok-soft);animation:pop .45s ease}
.row.new svg{color:var(--ok)}
@keyframes pop{0%{transform:scale(.97);opacity:.4}100%{transform:none;opacity:1}}
.slot{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:var(--r-sm);padding:8px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.slot svg{width:14px;height:14px}
.slot:hover{border-color:var(--acc);color:var(--acc)}
.slot.sel{background:var(--acc);border-style:solid;border-color:var(--acc);color:var(--on-acc)}

/* Reveal */
.verdict{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 15px;font-weight:700;font-size:14px}
.pill svg{width:16px;height:16px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.verdict p{margin:0;font-size:13.5px;color:var(--muted);text-wrap:balance}
.prompt{margin:0;text-align:center;font-size:14px;color:var(--muted);text-wrap:balance}
.prompt b{color:var(--acc)}

.winner{text-align:center;align-items:center;padding:26px 16px;border-color:var(--acc)}
.crown{width:48px;height:48px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.crown svg{width:24px;height:24px}
.winner .who{font:800 30px/1.1 var(--f-display);letter-spacing:-.02em;color:var(--acc);overflow-wrap:anywhere}

@media (max-width:420px){
  .disc{width:84px;height:84px}
  .disc::after{inset:27px}
  .s-year{font-size:40px}
  .tile{padding:9px}
  .tile-score b{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="brand"><span class="mark"><i></i></span><span class="wordmark">ChronoTune</span></div>
    <button class="linkbtn" id="quit" data-act="quit" hidden>End game</button>
  </header>
  <div id="top"></div>
  <section class="player" id="playerWrap" hidden>
    <div class="embed-box">
      <div id="embedHost"><div class="connecting">Connecting to Spotify…</div></div>
      <div class="mask" id="mask">
        <span class="sp" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9.5c4-1.3 8.6-1 12 1M7 13c3.2-.9 6.8-.6 9.6.9M8 16.3c2.5-.6 5-.4 7.2.7"/></svg></span>
        <div id="maskText"><b>Spotify player · details hidden</b>If the big play button stays silent, press ▶ on the right.</div>
      </div>
    </div>
  </section>
  <div id="bottom"></div>
</div>

<script src="songs.js"></script>

<script id="logic">
const Logic = (() => {
  const TIERS = {
    hits: s => s[4] >= 85 || s[5] === 0,
    popular: s => s[4] >= 65 || s[5] === 0,
    all: () => true,
  };
  const decadeOf = y => Math.floor(y / 10) * 10;

  function shuffle(arr, rnd = Math.random) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // A slot is correct when the year fits between its neighbours.
  // Inclusive on both sides, so a same-year song may go either side.
  function slotIsCorrect(timeline, idx, year) {
    const lo = idx > 0 ? timeline[idx - 1].year : -Infinity;
    const hi = idx < timeline.length ? timeline[idx].year : Infinity;
    return year >= lo && year <= hi;
  }

  function buildPool(songs, { tier = "popular", decades, custom = [], onlyCustom = false }) {
    const customIds = new Set(custom.map(c => c.id));
    const base = onlyCustom ? [] : songs
      .filter(s => TIERS[tier](s) && decades.has(decadeOf(s[2])) && !customIds.has(s[3]))
      .map(s => ({ title: s[0], artist: s[1], year: s[2], id: s[3] }));
    return base.concat(custom.map(c => ({ title: c.title, artist: c.artist, year: c.year, id: c.id, custom: true })));
  }

  function resolveTurn(players, current, card, activeSlot, stealer, stealSlot) {
    const np = players.map(p => ({ ...p, timeline: p.timeline.slice() }));
    const tried = stealer !== null && stealer !== undefined;
    if (tried) np[stealer].tokens -= 1;
    if (slotIsCorrect(np[current].timeline, activeSlot, card.year)) {
      np[current].timeline.splice(activeSlot, 0, card);
      return { players: np, outcome: { kind: "kept", by: current, index: activeSlot } };
    }
    if (tried && slotIsCorrect(np[stealer].timeline, stealSlot, card.year)) {
      np[stealer].timeline.splice(stealSlot, 0, card);
      return { players: np, outcome: { kind: "stolen", by: stealer, index: stealSlot } };
    }
    return { players: np, outcome: { kind: "discarded", by: null, stealTried: tried } };
  }

  // One song per line: year | Spotify link | title | artist  (title and artist optional; | ; or tab)
  function parseCustom(text, maxYear) {
    const songs = [], bad = [];
    text.split(/\r?\n/).forEach((raw, n) => {
      const line = raw.trim();
      if (!line) return;
      const parts = line.split(/\s*[|;\t]\s*/).map(p => p.trim()).filter(Boolean);
      let id = null, year = null;
      const rest = [];
      for (const p of parts) {
        const m = !id && p.match(/track[\/:]([A-Za-z0-9]{22})/);
        if (m) { id = m[1]; continue; }
        if (year === null && /^\d{4}$/.test(p)) { year = +p; continue; }
        rest.push(p);
      }
      if (!id || year === null || year < 1900 || year > maxYear) { bad.push(n + 1); return; }
      songs.push({ id, year, title: rest[0] || "Your song", artist: rest[1] || "Added by you" });
    });
    return { songs, bad };
  }

  function slotText(timeline, i) {
    const lo = i > 0 ? timeline[i - 1].year : null;
    const hi = i < timeline.length ? timeline[i].year : null;
    if (lo === null && hi === null) return "Place here";
    if (lo === null) return `Before ${hi}`;
    if (hi === null) return `After ${lo}`;
    if (lo === hi) return `In ${lo}`;
    return `Between ${lo} and ${hi}`;
  }

  return { TIERS, decadeOf, shuffle, slotIsCorrect, buildPool, resolveTurn, parseCustom, slotText };
})();
if (typeof module !== "undefined") module.exports = Logic;
</script>

<script>
(() => {
const START_TOKENS = 3, MAX_TOKENS = 5;
const DECADES = [1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020];
const TARGETS = [5, 10, 15];
const TIER_LABELS = [["hits", "Big hits"], ["popular", "Popular"], ["all", "Everything"]];
const THIS_YEAR = new Date().getFullYear();
const STORE = "chronotune.v1";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const acc = i => `--acc:var(--p${i + 1});--acc-soft:var(--p${i + 1}-soft)`;
const fmtN = n => n.toLocaleString("en-GB");
const fmtT = ms => { const s = Math.max(0, Math.round((ms || 0) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

const I = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  crown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3.5 8.5 8 12l4-6 4 6 4.5-3.5L19 18H5L3.5 8.5Z"/></svg>',
  coin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5h5" stroke-linecap="round"/></svg>',
};

/* ------------------------------ state ------------------------------ */
const S = {
  phase: "setup",
  n: 2, names: ["Player 1", "Player 2", "Player 3", "Player 4"],
  target: 10, tier: "popular", decades: new Set(DECADES),
  custom: [], onlyCustom: false, customDraft: "", customMsg: null, customOpen: false, clearArmed: false,
  setupMsg: "",
  players: [], current: 0, card: null, cardNo: 0,
  activeSlot: null, stealer: null, stealSlot: null, result: null,
  bonusUsed: false, revealAnimated: false, winner: null, endNote: "",
  deck: [], discard: [], quitArmed: false, installEvt: null,
};

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || "null");
    if (!d) return;
    if (Array.isArray(d.names)) d.names.slice(0, 4).forEach((v, i) => { if (typeof v === "string") S.names[i] = v; });
    if ([2, 3, 4].includes(d.n)) S.n = d.n;
    if (TARGETS.includes(d.target)) S.target = d.target;
    if (Logic.TIERS[d.tier]) S.tier = d.tier;
    const dec = Array.isArray(d.decades) ? d.decades.filter(x => DECADES.includes(x)) : [];
    if (dec.length) S.decades = new Set(dec);
    if (Array.isArray(d.custom)) S.custom = d.custom.filter(c => c && /^[A-Za-z0-9]{22}$/.test(c.id) && Number.isInteger(c.year));
    S.onlyCustom = !!d.onlyCustom && S.custom.length > 0;
  } catch (e) { /* storage unavailable: defaults are fine */ }
}
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({ names: S.names, n: S.n, target: S.target, tier: S.tier, decades: [...S.decades], custom: S.custom, onlyCustom: S.onlyCustom }));
  } catch (e) { /* ignore */ }
}
const poolOpts = () => ({ tier: S.tier, decades: S.decades, custom: S.custom, onlyCustom: S.onlyCustom });

/* ------------------------------ Spotify ------------------------------ */
const Player = {
  api: null, ctrl: null, mode: null, id: null, wantPlay: false, paused: true, pos: 0, dur: 0, failed: false, retry: null, blocked: false,

  init() {
    window.onSpotifyIframeApiReady = api => {
      this.api = api;
      if (this.id && !this.ctrl && this.mode !== "plain" && !this.blocked) this.load(this.id, this.wantPlay);
    };
    // A page that forbids Spotify (e.g. the claude.ai file preview) reports it here.
    document.addEventListener("securitypolicyviolation", e => { if (/spotify/i.test(e.blockedURI || "")) this.markBlocked(); });
    const s = document.createElement("script");
    s.src = "https://open.spotify.com/embed/iframe-api/v1";
    s.async = true;
    s.onerror = () => this.markBlocked();
    document.body.appendChild(s);
    setTimeout(() => { if (!this.api) { this.failed = true; if (this.id && !this.ctrl) this.load(this.id, false); } }, 7000);
  },

  markBlocked() {
    if (this.blocked) return;
    this.blocked = true;
    this.failed = true;
    render();
    if (this.id) this.showBlocked(this.id);
  },

  showBlocked(id) {
    $("#embedHost").innerHTML = `<div class="blocked"><b>Spotify can’t load.</b> Check your internet connection, then reload. <a href="https://open.spotify.com/track/${id}" target="_blank" rel="noopener">Open this song in Spotify</a> (shows the title).</div>`;
    paintTransport();
  },

  plain(id) {
    this.mode = "plain";
    $("#embedHost").innerHTML = `<iframe title="Spotify player" src="https://open.spotify.com/embed/track/${id}?utm_source=generator&theme=0" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="eager"></iframe>`;
    paintMaskText(); paintTransport();
  },

  load(id, autoplay) {
    this.id = id; this.wantPlay = autoplay; this.pos = 0; this.dur = 0; this.paused = true;
    clearTimeout(this.retry);
    paintTransport();
    if (this.blocked) return this.showBlocked(id);
    if (this.mode === "plain" || (!this.api && this.failed)) return this.plain(id);
    if (!this.api) return; // waits for onSpotifyIframeApiReady
    const uri = "spotify:track:" + id;
    if (!this.ctrl) {
      const host = $("#embedHost");
      host.innerHTML = "";
      const el = document.createElement("div");
      host.appendChild(el);
      let answered = false;
      this.api.createController(el, { uri, width: "100%", height: 80 }, c => {
        answered = true;
        this.ctrl = c;
        this.mode = "api";
        c.addListener("ready", () => { if (this.wantPlay) c.play(); });
        c.addListener("playback_update", e => this.update(e.data || {}));
        paintTransport(); paintMaskText();
      });
      setTimeout(() => { if (!answered) this.plain(this.id); }, 6000);
      return;
    }
    this.ctrl.loadUri(uri);
    if (autoplay) {
      this.ctrl.play();
      this.retry = setTimeout(() => { if (this.wantPlay && this.paused && this.id === id) this.ctrl.play(); }, 1300);
    }
  },

  update(d) {
    this.paused = !!d.isPaused;
    this.pos = d.position || 0;
    this.dur = d.duration || 0;
    if (!this.paused) this.wantPlay = false;
    paintTransport();
  },

  toggle() { if (this.ctrl) { this.wantPlay = false; this.ctrl.togglePlay(); } },
  pause() { this.wantPlay = false; clearTimeout(this.retry); if (this.ctrl && !this.paused) this.ctrl.pause(); },
  stop() {
    this.pause();
    if (this.mode === "plain") $("#embedHost").innerHTML = '<div class="connecting">Next song loads when you draw.</div>';
  },
};

function paintTransport() {
  const btn = $("#playBtn"), fill = $("#fill"), time = $("#time"), disc = $("#disc"), tr = $("#transport");
  if (tr) tr.hidden = Player.mode === "plain" || Player.blocked;
  if (btn) {
    btn.innerHTML = Player.paused ? I.play : I.pause;
    btn.setAttribute("aria-label", Player.paused ? "Play" : "Pause");
    btn.disabled = !Player.ctrl;
  }
  if (fill) fill.style.width = Player.dur ? `${Math.min(100, (Player.pos / Player.dur) * 100)}%` : "0%";
  if (time) time.textContent = Player.dur ? `${fmtT(Player.pos)} / ${fmtT(Player.dur)}` : (Player.ctrl || Player.mode === "plain" ? "0:00" : "loading");
  if (disc) disc.classList.toggle("spin", !Player.paused);
}
function paintMaskText() {
  $("#maskText").innerHTML = Player.mode === "plain"
    ? "<b>Spotify player · details hidden</b>Press ▶ on the right to play the song."
    : "<b>Spotify player · details hidden</b>If the big play button stays silent, press ▶ on the right.";
}

/* ------------------------------ flow ------------------------------ */
function startGame() {
  const pool = Logic.buildPool(SONGS, poolOpts());
  if (pool.length < S.n + 10) {
    S.setupMsg = `Only ${pool.length} songs match these settings. Add more decades, a wider song pool, or more of your own songs.`;
    return render();
  }
  const deck = Logic.shuffle(pool);
  S.players = Array.from({ length: S.n }, (_, i) => ({
    name: (S.names[i] || "").trim() || `Player ${i + 1}`,
    timeline: [deck.pop()],
    tokens: START_TOKENS,
  }));
  Object.assign(S, { deck, discard: [], current: Math.floor(Math.random() * S.n), cardNo: 0, card: null, result: null, winner: null, endNote: "", setupMsg: "", quitArmed: false, phase: "turnIntro" });
  save();
  render();
  window.scrollTo({ top: 0 });
}

function drawCard() {
  if (!S.deck.length) { S.deck = Logic.shuffle(S.discard); S.discard = []; }
  if (!S.deck.length) return endByExhaustion();
  Object.assign(S, { card: S.deck.pop(), activeSlot: null, stealer: null, stealSlot: null, result: null, bonusUsed: false, revealAnimated: false, phase: "placing" });
  S.cardNo += 1;
  render();
  Player.load(S.card.id, true);
}

function skipCard() {
  S.discard.push(S.card);
  drawCard();
}

function lockIn() {
  if (S.activeSlot === null) return;
  const anyStealer = S.players.some((p, i) => i !== S.current && p.tokens > 0);
  if (anyStealer) { S.phase = "stealOffer"; render(); }
  else resolve();
}

function resolve() {
  const r = Logic.resolveTurn(S.players, S.current, S.card, S.activeSlot, S.stealer, S.stealSlot);
  S.players = r.players;
  S.result = r.outcome;
  if (r.outcome.kind === "discarded") S.discard.push(S.card);
  S.phase = "reveal";
  render();
}

function nextTurn() {
  Player.stop();
  const w = S.players.findIndex(p => p.timeline.length >= S.target);
  if (w !== -1) { S.winner = w; S.phase = "gameover"; return render(); }
  S.current = (S.current + 1) % S.players.length;
  S.phase = "turnIntro";
  render();
  window.scrollTo({ top: 0 });
}

function endByExhaustion() {
  let best = 0;
  S.players.forEach((p, i) => { if (p.timeline.length > S.players[best].timeline.length) best = i; });
  S.winner = best;
  S.endNote = "The deck ran out, so the longest timeline wins.";
  S.phase = "gameover";
  render();
}

/* ------------------------------ views ------------------------------ */
function statusHTML() {
  return `<div class="status" style="--n:${S.players.length}">` + S.players.map((p, i) => {
    const active = i === S.current && S.phase !== "gameover";
    const dots = Array.from({ length: MAX_TOKENS }, (_, t) => `<i class="${t < p.tokens ? "on" : ""}"></i>`).join("");
    return `<div class="tile${active ? " active" : ""}" style="${acc(i)}">
      <div class="tile-name">${esc(p.name)}</div>
      <div class="tile-score"><b>${p.timeline.length}</b><span>/ ${S.target}</span></div>
      <div class="dots" title="${p.tokens} token${p.tokens === 1 ? "" : "s"}" aria-label="${p.tokens} tokens">${dots}</div>
    </div>`;
  }).join("") + "</div>";
}

function stageHTML() {
  const c = S.card, rev = S.phase === "reveal";
  const anim = rev && !S.revealAnimated ? " anim" : "";
  if (rev) S.revealAnimated = true;
  return `<section class="stage" style="${acc(S.current)}">
    <div class="stage-top">
      <div class="disc${Player.paused ? "" : " spin"}" id="disc" aria-hidden="true"></div>
      <div class="stage-info">
        <div class="eyebrow">Song ${S.cardNo} · ${esc(S.players[S.current].name)}’s turn</div>
        <div class="s-title">${rev ? esc(c.title) : "Mystery song"}</div>
        <div class="s-artist">${rev ? esc(c.artist) : "Title, artist and year stay hidden until the reveal"}</div>
        <div class="s-year${rev ? " on" : ""}${anim}" aria-label="${rev ? "Released " + c.year : "Year hidden"}">${rev ? c.year : "????"}</div>
      </div>
    </div>
    <div class="transport" id="transport">
      <button class="play" id="playBtn" data-act="toggle" aria-label="Play">${I.play}</button>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <span class="time" id="time">loading</span>
    </div>
    ${rev ? `<div class="stage-links"><a href="https://open.spotify.com/track/${c.id}" target="_blank" rel="noopener">${I.ext} Open in Spotify</a></div>` : ""}
  </section>`;
}

function timelineHTML(pi, { interactive = false, selected = null, highlight = null } = {}) {
  const p = S.players[pi], tl = p.timeline;
  const slot = i => !interactive ? "" :
    `<button class="slot${selected === i ? " sel" : ""}" data-act="slot" data-i="${i}" aria-pressed="${selected === i}">${selected === i ? I.check : I.plus}${Logic.slotText(tl, i)}</button>`;
  let rows = slot(0);
  tl.forEach((c, i) => {
    const isNew = highlight === i;
    rows += `<div class="row${isNew ? " new" : ""}"><span class="yr">${c.year}</span><span class="meta"><span class="t">${esc(c.title)}</span><span class="a">${esc(c.artist)}</span></span>${isNew ? I.check : ""}</div>` + slot(i + 1);
  });
  return `<section class="card tl" style="${acc(pi)}">
    <div class="tl-head"><span class="label acc-text">${esc(p.name)}’s timeline</span><span class="label num">${tl.length} / ${S.target}</span></div>
    <div class="tl-body">${rows}</div>
  </section>`;
}

function installHTML() {
  if (isStandalone()) return "";
  if (S.installEvt) return `<button class="btn ghost" data-act="install">${I.plus} Install ChronoTune on this device</button>`;
  if (isIOS) return `<p class="foot">To install on iPhone or iPad: tap Share, then <b>Add to Home Screen</b>.</p>`;
  return "";
}

function setupHTML() {
  const pool = Logic.buildPool(SONGS, poolOpts());
  const years = pool.map(s => s.year);
  const span = pool.length ? `${Math.min(...years)}–${Math.max(...years)}` : "—";
  const names = Array.from({ length: S.n }, (_, i) => `
    <label class="field" style="${acc(i)}"><span class="label acc-text">Player ${i + 1}</span>
      <input id="name${i}" data-name="${i}" value="${esc(S.names[i])}" maxlength="18" autocomplete="off"></label>`).join("");
  const seg = (items, cur, act) => `<div class="seg" role="group">${items.map(([v, l]) =>
    `<button data-act="${act}" data-v="${v}" aria-pressed="${String(v) === String(cur)}">${l}</button>`).join("")}</div>`;
  const chips = DECADES.map(d => `<button class="chip" data-act="decade" data-v="${d}" aria-pressed="${S.decades.has(d)}">${d}s</button>`).join("");
  const mine = S.custom.map((c, i) => `<li><span class="yr">${c.year}</span><span class="t" title="${esc(c.title)} · ${esc(c.artist)}">${esc(c.title)} · ${esc(c.artist)}</span><button class="x" data-act="rmCustom" data-i="${i}" aria-label="Remove ${esc(c.title)}">×</button></li>`).join("");
  const cm = S.customMsg;

  return `
  ${Player.blocked ? `<div class="alert"><b>No sound right now.</b> Spotify can’t load. Check your internet connection, then reload the page.</div>` : ""}
  <p class="lede">Hear a song, place it in time. First to ${S.target} songs in the right order wins.</p>

  <section class="card">
    <div class="setrow"><span>Players</span>${seg([[2, "2"], [3, "3"], [4, "4"]], S.n, "n")}</div>
    <div class="grid2">${names}</div>
  </section>

  <section class="card">
    <div class="setrow"><span>Songs to win</span>${seg(TARGETS.map(t => [t, t]), S.target, "target")}</div>
    <div class="setrow"><span>Song pool</span>${seg(TIER_LABELS, S.tier, "tier")}</div>
    <div class="field"><span class="label">Decades</span><div class="chips">${chips}</div></div>
    <div class="poolline"><span>${S.onlyCustom ? "Only your songs" : "Songs in the deck"}</span><span><b>${fmtN(pool.length)}</b> · ${span}</span></div>
  </section>

  <details class="card" id="customBox" ${S.customOpen || S.custom.length ? "open" : ""}>
    <summary>Add your own songs <span class="badge">${S.custom.length}</span></summary>
    <p class="hint">One song per line: <b>year | Spotify link | title | artist</b>. Title and artist are optional. In Spotify, use ··· → Share → Copy song link.</p>
    <textarea id="customText" spellcheck="false" placeholder="1987 | https://open.spotify.com/track/7nZCg1jgmXIjSBRifWkmaJ | Joe le taxi | Vanessa Paradis">${esc(S.customDraft)}</textarea>
    <div class="btnrow">
      <button class="btn ghost sm" data-act="addCustom">${I.plus} Add songs</button>
      ${S.custom.length ? `<button class="btn ghost sm" data-act="clearCustom">${S.clearArmed ? "Tap again to remove all" : "Remove all"}</button>` : ""}
    </div>
    ${cm ? `<p class="msg ${cm.ok ? "ok" : "bad"}">${esc(cm.text)}</p>` : ""}
    ${S.custom.length ? `<ul class="mylist">${mine}</ul>
    <label class="check"><input type="checkbox" id="onlyCustom" ${S.onlyCustom ? "checked" : ""}> Play only my songs</label>` : ""}
  </details>

  <div class="note">
    <p><b>How to play.</b> Everyone starts with one song on their timeline. On your turn, listen to a mystery song and slot it where you think it belongs. Right, it stays. Wrong, another player can spend a token to place it on their own timeline instead. Name the title and artist for a bonus token. Songs from the same year can go on either side.</p>
    <p><b>Sound.</b> Songs play through Spotify’s embedded player. Logged in to Spotify in this browser: full songs. Otherwise, or if the browser blocks third-party cookies: 30-second previews.</p>
  </div>

  ${S.setupMsg ? `<p class="msg bad" style="text-align:center">${esc(S.setupMsg)}</p>` : ""}
  <button class="btn" data-act="start" ${pool.length ? "" : "disabled"}>Start game ${I.arrow}</button>
  ${installHTML()}
  <p class="foot">Song list and original release years from the open-source <a href="https://github.com/sjmarais9/hitster" target="_blank" rel="noopener">sjmarais9/hitster</a> deck, cross-checked against MusicBrainz.</p>`;
}

function render() {
  keepAwake(S.phase !== "setup");
  const top = $("#top"), bottom = $("#bottom");
  const playing = ["placing", "stealOffer", "stealPlacing", "reveal"].includes(S.phase);
  $("#playerWrap").hidden = !playing;
  $("#mask").hidden = S.phase === "reveal" || Player.blocked;
  const quit = $("#quit");
  quit.hidden = S.phase === "setup";
  quit.textContent = S.quitArmed ? "Tap again to end" : (S.phase === "gameover" ? "New game" : "End game");
  quit.classList.toggle("armed", S.quitArmed);
  bottom.innerHTML = "";

  const P = S.players, cur = S.current;

  if (S.phase === "setup") {
    top.innerHTML = setupHTML();
    return;
  }

  if (S.phase === "turnIntro") {
    top.innerHTML = statusHTML() + `
      <section class="card handoff" style="${acc(cur)}">
        <span class="label">Pass the device to</span>
        <div class="who">${esc(P[cur].name)}</div>
        <span class="hint">Draw a song, listen, then place it on your timeline.</span>
      </section>
      <button class="btn acc" style="${acc(cur)}" data-act="draw">Draw a song ${I.arrow}</button>
      ${timelineHTML(cur)}`;
    return;
  }

  if (S.phase === "placing") {
    top.innerHTML = statusHTML() + stageHTML();
    bottom.innerHTML = `
      <div class="tools"><p class="prompt"><b style="${acc(cur)}">${esc(P[cur].name)}</b>, where does it go?</p>
        <button class="linkbtn" data-act="skip">Skip, it won’t play</button></div>
      ${timelineHTML(cur, { interactive: true, selected: S.activeSlot })}
      <button class="btn acc" style="${acc(cur)}" data-act="lock" ${S.activeSlot === null ? "disabled" : ""}>Lock in ${I.check}</button>`;
    paintTransport();
    return;
  }

  if (S.phase === "stealOffer") {
    const where = Logic.slotText(P[cur].timeline, S.activeSlot).toLowerCase();
    const options = P.map((p, i) => (i !== cur && p.tokens > 0)
      ? `<button class="btn acc" style="${acc(i)}" data-act="steal" data-i="${i}">${I.swap} ${esc(p.name)} steals <span class="num">(${p.tokens} token${p.tokens === 1 ? "" : "s"})</span></button>` : "").join("");
    top.innerHTML = statusHTML() + stageHTML();
    bottom.innerHTML = `
      <section class="card" style="text-align:center">
        <span class="label">Steal?</span>
        <p class="prompt"><b style="${acc(cur)}">${esc(P[cur].name)}</b> placed it <b style="${acc(cur)}">${esc(where)}</b>. Think that’s wrong? Spend a token to place it on your own timeline. If ${esc(P[cur].name)} misses and you’re right, it’s yours.</p>
      </section>
      ${options}
      <button class="btn ghost" data-act="nosteal">No steal, reveal the year</button>`;
    paintTransport();
    return;
  }

  if (S.phase === "stealPlacing") {
    const st = S.stealer;
    top.innerHTML = statusHTML() + stageHTML();
    bottom.innerHTML = `
      <p class="prompt"><b style="${acc(st)}">${esc(P[st].name)}</b>, place the steal on your timeline.</p>
      ${timelineHTML(st, { interactive: true, selected: S.stealSlot })}
      <button class="btn acc" style="${acc(st)}" data-act="lockSteal" ${S.stealSlot === null ? "disabled" : ""}>Lock in steal ${I.check}</button>
      <button class="btn ghost" data-act="cancelSteal">Cancel steal</button>`;
    paintTransport();
    return;
  }

  if (S.phase === "reveal") {
    const r = S.result, c = S.card;
    let pill, line, tl;
    if (r.kind === "kept") {
      pill = `<span class="pill ok">${I.check} ${esc(P[cur].name)} keeps it</span>`;
      line = "Right spot on the timeline.";
      tl = timelineHTML(cur, { highlight: r.index });
    } else if (r.kind === "stolen") {
      pill = `<span class="pill warn">${I.swap} ${esc(P[r.by].name)} steals it</span>`;
      line = `${esc(P[cur].name)} missed. The steal landed.`;
      tl = timelineHTML(r.by, { highlight: r.index });
    } else {
      const where = Logic.slotText(P[cur].timeline, S.activeSlot).toLowerCase();
      pill = `<span class="pill bad">${I.x} ${r.stealTried ? "Both missed" : "Missed"}, discarded</span>`;
      line = `Released in ${c.year}. ${esc(P[cur].name)} placed it ${esc(where)}.`;
      tl = timelineHTML(cur);
    }
    const canBonus = !S.bonusUsed && P[cur].tokens < MAX_TOKENS;
    top.innerHTML = statusHTML() + stageHTML();
    bottom.innerHTML = `
      <div class="verdict">${pill}<p>${line}</p></div>
      ${tl}
      <button class="btn ghost" data-act="bonus" ${canBonus ? "" : "disabled"}>${I.coin} ${S.bonusUsed ? `Bonus token given to ${esc(P[cur].name)}` : (P[cur].tokens >= MAX_TOKENS ? `${esc(P[cur].name)} has the maximum ${MAX_TOKENS} tokens` : `${esc(P[cur].name)} named title and artist: +1 token`)}</button>
      <button class="btn" data-act="next">Continue ${I.arrow}</button>`;
    paintTransport();
    return;
  }

  if (S.phase === "gameover") {
    const w = S.winner;
    top.innerHTML = `
      <section class="card winner" style="${acc(w)}">
        <span class="crown">${I.crown}</span>
        <div class="who">${esc(P[w].name)} wins</div>
        <span class="hint">${S.endNote ? esc(S.endNote) + " " : ""}A timeline of ${P[w].timeline.length} songs, ${P[w].timeline[0].year} to ${P[w].timeline[P[w].timeline.length - 1].year}.</span>
      </section>
      ${timelineHTML(w)}
      <button class="btn" data-act="again">Play again</button>`;
  }
}

/* ------------------------------ events ------------------------------ */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v, i = +b.dataset.i;
  if (act !== "quit" && S.quitArmed) { S.quitArmed = false; }
  if (act !== "clearCustom") S.clearArmed = false;
  switch (act) {
    case "n": S.n = +v; S.setupMsg = ""; save(); return render();
    case "target": S.target = +v; save(); return render();
    case "tier": S.tier = v; S.setupMsg = ""; save(); return render();
    case "decade": {
      const d = +v;
      if (S.decades.has(d)) { if (S.decades.size > 1) S.decades.delete(d); } else S.decades.add(d);
      S.setupMsg = ""; save(); return render();
    }
    case "addCustom": {
      const { songs, bad } = Logic.parseCustom(S.customDraft, THIS_YEAR);
      const known = new Map(S.custom.map(c => [c.id, c]));
      songs.forEach(s => known.set(s.id, s));
      S.custom = [...known.values()].sort((a, b) => a.year - b.year);
      if (songs.length) S.customDraft = bad.length ? S.customDraft.split(/\r?\n/).filter((_, n) => bad.includes(n + 1)).join("\n") : "";
      S.customMsg = !songs.length && !bad.length ? { ok: false, text: "Paste at least one line first." }
        : bad.length ? { ok: !!songs.length, text: `${songs.length} added. Line${bad.length > 1 ? "s" : ""} ${bad.join(", ")} need${bad.length > 1 ? "" : "s"} a year (1900–${THIS_YEAR}) and a Spotify track link; ${bad.length > 1 ? "they stay" : "it stays"} in the box to fix.` }
        : { ok: true, text: `${songs.length} song${songs.length > 1 ? "s" : ""} added.` };
      S.customOpen = true; save(); return render();
    }
    case "rmCustom": S.custom.splice(i, 1); if (!S.custom.length) S.onlyCustom = false; S.customMsg = null; save(); return render();
    case "clearCustom":
      if (!S.clearArmed) { S.clearArmed = true; return render(); }
      S.custom = []; S.onlyCustom = false; S.clearArmed = false; S.customMsg = { ok: true, text: "Your songs were removed." }; save(); return render();
    case "start": return startGame();
    case "install":
      if (S.installEvt) { S.installEvt.prompt(); S.installEvt.userChoice.finally(() => { S.installEvt = null; render(); }); }
      return;
    case "draw": return drawCard();
    case "toggle": return Player.toggle();
    case "skip": return skipCard();
    case "slot":
      if (S.phase === "placing") S.activeSlot = i; else if (S.phase === "stealPlacing") S.stealSlot = i;
      return render();
    case "lock": return lockIn();
    case "steal": S.stealer = i; S.stealSlot = null; S.phase = "stealPlacing"; return render();
    case "cancelSteal": S.stealer = null; S.stealSlot = null; S.phase = "stealOffer"; return render();
    case "nosteal": S.stealer = null; S.stealSlot = null; return resolve();
    case "lockSteal": if (S.stealSlot !== null) resolve(); return;
    case "bonus":
      if (!S.bonusUsed && S.players[S.current].tokens < MAX_TOKENS) { S.players[S.current].tokens += 1; S.bonusUsed = true; }
      return render();
    case "next": return nextTurn();
    case "again": Player.stop(); S.phase = "setup"; render(); return window.scrollTo({ top: 0 });
    case "quit":
      if (S.phase === "gameover") { S.phase = "setup"; return render(); }
      if (!S.quitArmed) { S.quitArmed = true; return render(); }
      S.quitArmed = false; Player.stop(); S.phase = "setup"; render(); return window.scrollTo({ top: 0 });
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.name !== undefined) { S.names[+t.dataset.name] = t.value; save(); }
  else if (t.id === "customText") S.customDraft = t.value;
});
document.addEventListener("change", e => {
  if (e.target.id === "onlyCustom") { S.onlyCustom = e.target.checked; save(); render(); }
});
document.addEventListener("toggle", e => { if (e.target.id === "customBox") S.customOpen = e.target.open; }, true);

/* ------------------------------ app shell ------------------------------ */
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; if (S.phase === "setup") render(); });
window.addEventListener("appinstalled", () => { S.installEvt = null; if (S.phase === "setup") render(); });

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch (e) { /* not supported or refused: the game still works */ }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(S.phase !== "setup"); });

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

load();
Player.init();
render();
})();
</script>
</body>
</html>
